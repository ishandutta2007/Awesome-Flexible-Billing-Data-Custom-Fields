<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 5; fill-opacity: 0.7; }
      50% { r: 7.5; fill-opacity: 1; }
    }
    .orb1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1000px 320px; }
    .card-float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 7s ease-in-out infinite; }
    .pulse-data-line { stroke-dasharray: 8 6; animation: dashCycle 25s linear infinite; }
    .node-anim-1 { animation: nodePulse 3s ease-in-out infinite; }
    .node-anim-2 { animation: nodePulse 4s ease-in-out infinite 1s; }
    .node-anim-3 { animation: nodePulse 3.5s ease-in-out infinite 2s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Atmosphere Orbs -->
  <circle class="orb1" cx="200" cy="110" r="140" fill="#38bdf8" filter="url(#glow)" />
  <circle class="orb2" cx="1000" cy="310" r="160" fill="#a855f7" filter="url(#glow)" />
  <circle cx="600" cy="210" r="160" fill="#6366f1" filter="url(#glow)" opacity="0.15" />

  <!-- Background Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Border Frame -->
  <rect x="2" y="2" width="1196" height="416" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Dynamic Schema Flow Diagrams (Side Cards) -->
  <g class="card-float-1" opacity="0.65">
    <!-- Left Entity Card -->
    <rect x="45" y="235" width="175" height="135" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    <rect x="45" y="235" width="175" height="28" rx="10" fill="#0284c7" fill-opacity="0.25" />
    <text x="58" y="254" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="bold" font-size="11.5">⚙️ INVOICE_SCHEMA</text>
    <text x="58" y="280" fill="#94a3b8" font-family="monospace" font-size="10.5">invoice_id: UUID</text>
    <text x="58" y="300" fill="#94a3b8" font-family="monospace" font-size="10.5">account_ref: FK ➔</text>
    <text x="58" y="320" fill="#94a3b8" font-family="monospace" font-size="10.5">custom_fields: JSONB</text>
    <text x="58" y="340" fill="#34d399" font-family="monospace" font-size="10.5">metadata: KV_Store</text>
  </g>

  <g class="card-float-2" opacity="0.65">
    <!-- Right Schema Node Card -->
    <rect x="980" y="55" width="175" height="135" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" />
    <rect x="980" y="55" width="175" height="28" rx="10" fill="#9333ea" fill-opacity="0.25" />
    <text x="993" y="74" fill="#c084fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="bold" font-size="11.5">📊 BILLING_ENGINE</text>
    <text x="993" y="100" fill="#94a3b8" font-family="monospace" font-size="10.5">tags: EAV_Array</text>
    <text x="993" y="120" fill="#94a3b8" font-family="monospace" font-size="10.5">metering: Stream</text>
    <text x="993" y="140" fill="#94a3b8" font-family="monospace" font-size="10.5">plan_override: True</text>
    <text x="993" y="160" fill="#38bdf8" font-family="monospace" font-size="10.5">sync_state: Realtime</text>
  </g>

  <!-- Dynamic Animated Relational Connection Paths -->
  <path class="pulse-data-line" d="M 220 300 C 340 300, 360 210, 470 210" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />
  <path class="pulse-data-line" d="M 730 210 C 840 210, 860 120, 980 120" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.5" />
  
  <circle class="node-anim-1" cx="220" cy="300" r="5" fill="#38bdf8" />
  <circle class="node-anim-2" cx="600" cy="210" r="6" fill="#818cf8" />
  <circle class="node-anim-3" cx="980" cy="120" r="5" fill="#c084fc" />

  <!-- FOREGROUND: Header Pill, Title & Tagline -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <g transform="translate(600, 68)">
      <rect x="-195" y="-18" width="390" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="-172" cy="0" r="5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text class="tagline" x="-156" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="1.4">EXTENSIBLE SCHEMAS &amp; BILLING METADATA</text>
    </g>

    <!-- Main Title -->
    <text class="title" x="600" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="38" fill="url(#primaryGrad)" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Awesome Flexible Billing Data &amp; Custom Fields
    </text>

    <!-- Subtitle / Tagline -->
    <text class="subtitle" x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="17" fill="#f1f5f9" letter-spacing="0.2">
      Dynamic Schemas • Custom Metadata • Key-Value Stores • Open-Source Billing Engines
    </text>

    <text class="desc" x="600" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14" fill="#94a3b8">
      Curated directory of SaaS billing platforms, custom object models, and self-hosted field engines
    </text>

    <!-- Architectural Feature Pills (Bottom Row) -->
    <g transform="translate(180, 275)">
      <!-- Pill 1: Custom Field APIs -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="195" height="52" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
        <circle cx="26" cy="26" r="10" fill="#0284c7" opacity="0.4" />
        <text x="26" y="30" text-anchor="middle" font-size="12" fill="#38bdf8">⚡</text>
        <text class="node-text" x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Custom Field APIs</text>
        <text class="node-desc" x="46" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Typed Entities &amp; UI Types</text>
      </g>

      <!-- Pill 2: Metadata Key-Values -->
      <g transform="translate(215, 0)">
        <rect x="0" y="0" width="195" height="52" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />
        <circle cx="26" cy="26" r="10" fill="#6366f1" opacity="0.4" />
        <text x="26" y="30" text-anchor="middle" font-size="12" fill="#a5b4fc">🏷️</text>
        <text class="node-text" x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Object Metadata</text>
        <text class="node-desc" x="46" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Arbitrary Key-Value Stores</text>
      </g>

      <!-- Pill 3: Self-Hosted Billing -->
      <g transform="translate(430, 0)">
        <rect x="0" y="0" width="195" height="52" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6" />
        <circle cx="26" cy="26" r="10" fill="#9333ea" opacity="0.4" />
        <text x="26" y="30" text-anchor="middle" font-size="12" fill="#c084fc">🚀</text>
        <text class="node-text" x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Open-Source Billing</text>
        <text class="node-desc" x="46" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Kill Bill, Flexprice &amp; ERP</text>
      </g>

      <!-- Pill 4: No-Code Data Layers -->
      <g transform="translate(645, 0)">
        <rect x="0" y="0" width="195" height="52" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.6" />
        <circle cx="26" cy="26" r="10" fill="#059669" opacity="0.4" />
        <text x="26" y="30" text-anchor="middle" font-size="12" fill="#34d399">🗄️</text>
        <text class="node-text" x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Flexible Data Layers</text>
        <text class="node-desc" x="46" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Baserow, NocoDB &amp; Grist</text>
      </g>
    </g>

    <!-- Footer Tagline -->
    <text x="600" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" letter-spacing="1">
      COMMERCIAL BILLING APIS • OPEN-SOURCE BILLING ENGINES • NO-CODE EXTENSIBLE DATABASES
    </text>
  </g>
</svg>